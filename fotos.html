<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos de inspeccion</title>
    <link rel="stylesheet" href="fotos.css">
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
</head>
<body>
    <main class="photos-app">
        <header class="photos-header">
            <div>
                <p class="eyebrow">BITAUTO / INSPECCION</p>
                <h1>Fotos del vehiculo</h1>
                <p id="plateLabel" class="plate-label"></p>
            </div>
        </header>

        <section class="photo-panel" aria-labelledby="capture-title">
            <div class="panel-heading">
                <div><h2 id="capture-title">Captura local</h2><p id="photoStatus" aria-live="polite">Preparando almacenamiento...</p></div>
                <strong id="photoCount">0 fotos</strong>
            </div>
            <div class="capture-actions">
                <label class="action-button primary" for="photoInput">Tomar foto</label>
                <input id="photoInput" class="visually-hidden" type="file" accept="image/*" capture="environment" multiple>
                <input id="detailPhotoInput" class="visually-hidden" type="file" accept="image/*" capture="environment">
                <button id="downloadPhotosBtn" class="action-button" type="button">Descargar fotos</button>
                <button id="createSuzukiBtn" class="action-button" type="button" hidden>Descargar formato DERCO</button>
            </div>
            <div id="photoGrid" class="photo-grid" aria-live="polite"></div>
        </section>
        <div class="photo-navigation">
            <a class="nav-button data-link" href="index.html">Datos</a>
            <a class="nav-button" href="correo.html">Finalizar</a>
        </div>
    </main>

    <div id="photoEditor" class="photo-editor" role="dialog" aria-modal="true" aria-labelledby="editorTitle" hidden>
        <div class="editor-header"><div><h2 id="editorTitle">Marcar foto</h2><p>Cierra el trazo para formar un circulo o dibuja una linea para crear una flecha.</p></div><div class="editor-header-actions"><button id="cancelEditBtn" type="button">Cancelar</button></div></div>
        <div class="canvas-wrap"><canvas id="photoCanvas"></canvas></div>
        <div class="editor-actions"><div class="editor-command-row"><input id="editorCommandInput" type="text" placeholder="Selecciona un repuesto" autocomplete="off" readonly inputmode="none" aria-haspopup="listbox" aria-controls="editorPartsMenu"></div><div id="editorPartsMenu" class="editor-parts-menu" role="listbox" hidden></div><p id="editorVoiceStatus" class="editor-voice-status" aria-live="polite">Toca el campo para seleccionar un repuesto.</p><div class="editor-button-row"><button id="clearDrawingBtn" type="button">Limpiar trazos</button><button id="saveMarkedBtn" type="button">Guardar Foto Marcada</button></div></div>
    </div>
    <div id="deleteModal" class="delete-modal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle" hidden>
        <div class="delete-modal-card">
            <h2 id="deleteModalTitle">Eliminar foto</h2>
            <p>¿Deseas eliminar esta foto?</p>
            <div class="delete-modal-actions"><button id="cancelDeleteBtn" type="button">Cancelar</button><button id="confirmDeleteBtn" class="confirm-delete-button" type="button">Eliminar</button></div>
        </div>
    </div>
    <script src="fotos.js"></script>
</body>
</html>
