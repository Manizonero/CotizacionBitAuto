<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos de inspeccion</title>
    <link rel="stylesheet" href="fotos.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <nav class="top-nav" aria-label="Navegacion principal">
        <a href="dashboard.html" class="nav-ico" aria-label="Datos" title="Datos"><span aria-hidden="true">📥</span></a>
        <a href="index.html" class="nav-ico" aria-label="Detalles" title="Detalles"><span aria-hidden="true">📋</span></a>
        <a href="generales.html" class="nav-ico" aria-label="Generales" title="Generales"><span aria-hidden="true">🚗</span></a>
        <a id="photosLink" href="fotos.html" class="nav-ico" aria-label="Fotos" title="Fotos"><span aria-hidden="true">📷</span></a>
        <a href="verificacion.html" class="nav-ico" aria-label="Verificacion" title="Verificacion"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#315ddc" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></a>
        <a href="correo.html" class="nav-ico" aria-label="Correo" title="Correo"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#315ddc" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg></a>
    </nav>
    <main class="photos-app">
        <header class="photos-header">
            <div>
                <p class="eyebrow">BITAUTO / INSPECCION</p>
                <h1>Fotos por repuesto</h1>
                <p id="plateLabel" class="plate-label"></p>
            </div>
        </header>
        <section class="photo-panel">
            <div class="panel-heading">
                <div><h2>Fotos por repuesto</h2><p id="photoStatus">Preparando almacenamiento...</p></div>
                <strong id="photoCount">0 fotos</strong>
            </div>
            <div id="repuestosList" class="repuestos-list"></div>
            <div id="repuestosNa" class="repuestos-na" hidden>
                <h3>REPUESTOS SIN FOTO (N/A)</h3>
                <div id="repuestosNaList" class="repuestos-list"></div>
            </div>
        </section>
        <div class="download-actions">
            <button id="downloadPhotosBtn" class="action-button">Descargar fotos</button>
        </div>
    </main>
    <div id="photoEditor" class="photo-editor" hidden>
        <div class="editor-header"><div><h2>Marcar foto</h2></div><div><button id="cancelEditBtn">Cancelar</button></div></div>
        <div class="canvas-wrap"><canvas id="photoCanvas"></canvas></div>
        <div class="editor-actions">
            <div class="editor-selects" style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
                <select id="damageSelect" class="damage-select">
                    <option value="">SELECCIONA UN DAÑO</option>
                    <option value="Golpe">Golpe</option>
                    <option value="Hundido">Hundido</option>
                    <option value="Rizado">Rizado</option>
                    <option value="Rayones">Rayones</option>
                    <option value="Fisura">Fisura</option>
                    <option value="Quebrado">Quebrado</option>
                    <option value="Difuminado">Difuminado</option>
                    <option value="Foto Referencia">Foto Referencia</option>
                    <option value="Despicado">Despicado</option>
                    <option value="Reventado">Reventado</option>
                    <option value="Faltan">Faltan</option>
                </select>
                <select id="repuestoSelect" class="damage-select">
                    <option value="">SELECCIONA UN REPUESTO</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="clearDrawingBtn" style="flex: 1;">Undo</button>
                <button id="saveMarkedBtn" style="flex: 1;">Guardar</button>
            </div>
        </div>
    </div>
    <div id="deleteModal" class="delete-modal" hidden>
        <div class="delete-modal-card"><h2>Eliminar foto</h2><div class="delete-modal-actions"><button id="cancelDeleteBtn">No</button><button id="confirmDeleteBtn">Sí</button></div></div>
    </div>
    <div id="alertModal" class="delete-modal" hidden>
        <div class="delete-modal-card"><h2>ATENCIÓN</h2><p id="alertMessage"></p><div class="delete-modal-actions"><button id="closeAlertBtn">Entendido</button></div></div>
    </div>
    <script src="storage.js"></script>
    <script src="fotos.js"></script>
</body>
</html>
