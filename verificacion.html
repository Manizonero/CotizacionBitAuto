<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificacion de repuestos</title>
    <link rel="stylesheet" href="verificacion.css">
</head>
<body>
    <nav class="top-nav" aria-label="Navegacion principal">
        <a href="index.html" class="nav-ico" aria-label="Datos" title="Datos"><span aria-hidden="true">📋</span></a>
        <a href="generales.html" class="nav-ico" aria-label="Generales" title="Generales"><span aria-hidden="true">🚗</span></a>
        <a href="fotos.html" class="nav-ico" aria-label="Fotos" title="Fotos"><span aria-hidden="true">📷</span></a>
        <a href="verificacion.html" class="nav-ico" aria-label="Verificacion" title="Verificacion"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#315ddc" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></a>
        <a href="correo.html" class="nav-ico" aria-label="Correo" title="Correo"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#315ddc" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg></a>
    </nav>
    <main class="verif-app">
        <header class="verif-header">
            <div>
                <p class="eyebrow">BITAUTO / INSPECCION</p>
                <h1>Verificacion de repuestos</h1>
                <p id="verifPlateLabel" class="muted"></p>
            </div>
        </header>

        <section class="verif-panel" aria-labelledby="verif-title">
            <div class="panel-heading">
                <div>
                    <h2 id="verif-title">Lista de repuestos</h2>
                    <p id="verifStatus" class="muted" aria-live="polite">Selecciona los repuestos que ingresaste.</p>
                </div>
                <strong id="verifCount" class="count-badge">0</strong>
            </div>
            <p class="panel-caption">Marca la casilla de cada repuesto que confirmaste su ingreso.</p>
            <div id="verifList" class="verif-list" aria-live="polite"></div>
            <p id="verifEmpty" class="panel-caption" hidden>No hay repuestos para verificar.</p>
        </section>

        <div class="verif-actions">
            <button id="resetBtn" class="action-button" type="button">Restablecer datos</button>
        </div>
    </main>
    <script src="storage.js"></script>
    <script src="verificacion.js"></script>
</body>
</html>
