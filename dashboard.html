<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandeja de Cotizaciones</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#315ddc">
    <style>
        .dashboard-container {
            width: 95%;
            max-width: 1120px;
            margin: 20px auto;
        }
        .quote-list {
            display: grid;
            gap: 12px;
            margin-top: 16px;
        }
        .quote-item {
            background: #ffffff;
            border: 1px solid #d8e0f0;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .quote-item.active {
            border-left: 6px solid #315ddc;
            background: #f8fbff;
        }
        .quote-info h3 {
            margin: 0;
            font-size: 1.2rem;
            color: #16213d;
        }
        .quote-info p {
            margin: 2px 0 6px;
            color: #6d7592;
            font-size: 0.85rem;
        }
        .quote-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .status-badges {
            display: flex;
            gap: 6px;
        }
        .status-badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-done { background: #e5f6ec; color: #17643a; }
        .status-pending { background: #fff1f0; color: #cf1322; }

        .finalize-btn {
            background: #17643a;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .delete-btn {
            background: #fff0f2;
            color: #b52d40;
            border: 1px solid #fcc;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .delete-btn:hover { background: #ffe0e2; }
        .new-btn-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }
        @media (max-width: 600px) {
            .quote-item { flex-direction: column; align-items: flex-start; }
            .quote-actions { width: 100%; justify-content: space-between; margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }
            .site-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <nav class="top-nav" aria-label="Navegacion principal">
        <a href="dashboard.html" class="nav-ico" aria-label="Datos" title="Datos"><span aria-hidden="true">📥</span></a>
        <a href="index.html" class="nav-ico" aria-label="Detalles" title="Detalles"><span aria-hidden="true">📋</span></a>
        <a href="generales.html" class="nav-ico" aria-label="Generales" title="Generales"><span aria-hidden="true">🚗</span></a>
        <a id="photosLink" href="fotos.html" class="nav-ico" aria-label="Fotos" title="Fotos"><span aria-hidden="true">📷</span></a>
        <a href="verificacion.html" class="nav-ico" aria-label="Verificacion" title="Verificacion"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#315ddc" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></a>
        <a href="correo.html" class="nav-ico" aria-label="Correo" title="Correo"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#315ddc" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg></a>
    </nav>

    <div class="dashboard-container">
        <header class="site-header" style="margin-top: 0; width: 100%;">
            <button type="button" id="userNameDisplay" class="user-name-display" aria-label="Editar usuario"></button>
            <h1 class="site-title">DATOS</h1>
        </header>
        <div class="new-btn-container">
            <button id="createNewBtn" class="secondary-button" style="background: #315ddc; color: white;">+ Nueva Cotización</button>
        </div>
        <div id="quoteList" class="quote-list"></div>
    </div>

    <div id="deleteModal" class="user-modal" hidden>
        <div class="user-modal-content">
            <h2 style="color: #b52d40;">¿Eliminar cotización?</h2>
            <p>Se borrarán todos los datos de esta cotización de forma permanente y no hay forma de recuperarlos.</p>
            <div class="new-quote-warning-actions" style="margin-top: 20px;">
                <button id="cancelDeleteBtn" class="secondary-button">Cancelar</button>
                <button id="confirmDeleteBtn" class="secondary-button warning-button">Eliminar permanentemente</button>
            </div>
        </div>
    </div>

    <div id="alertModal" class="user-modal" hidden>
        <div class="user-modal-content">
            <h2>ATENCIÓN</h2><p id="alertMessage"></p>
            <button id="closeAlertBtn" class="secondary-button" style="margin-top: 20px;">Entendido</button>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="dashboard.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js');
            });
        }
    </script>
</body>
</html>
