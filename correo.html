<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar cotizacion</title>
    <link rel="stylesheet" href="correo.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <nav class="top-nav" aria-label="Navegacion principal">
        <a href="dashboard.html" class="nav-ico" aria-label="Datos" title="Datos"><span aria-hidden="true">📥</span></a>
        <a href="index.html" class="nav-ico" aria-label="Detalles" title="Detalles"><span aria-hidden="true">📋</span></a>
        <a href="generales.html" class="nav-ico" aria-label="Generales" title="Generales"><span aria-hidden="true">🚗</span></a>
        <a id="photosLink" href="fotos.html" class="nav-ico" aria-label="Fotos" title="Fotos"><span aria-hidden="true">📷</span></a>
        <a href="verificacion.html" class="nav-ico" aria-label="Verificacion" title="Verificacion"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#315ddc" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></a>
        <a href="correo.html" class="nav-ico" aria-label="Correo" title="Correo"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#315ddc" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg></a>
    </nav>
    <main class="mail-app">
        <header class="mail-header">
            <div><p class="eyebrow">BITAUTO / COTIZACION</p><h1>Preparar correo</h1><p id="mailVehicleLabel" class="muted"></p></div>
        </header>
        <section class="mail-panel">
            <div class="panel-title"><div><p class="eyebrow">GRUPO DE ENVÍO</p><h2>Selecciona el grupo</h2></div></div>
            <select id="groupSelector" class="wide-input" style="margin-top: 10px;">
                <option value="">Selecciona un grupo...</option>
            </select>
            <div id="groupRecipients" class="muted" style="margin-top: 8px; font-size: 0.9rem;"></div>
        </section>
        <section class="mail-panel">
            <div class="panel-title"><div><p class="eyebrow">DESTINATARIOS</p><h2>Gestionar contactos y grupos</h2><p id="selectedRecipients" class="muted">Configura tus correos de envío.</p></div><button id="openRecipientsBtn" class="button primary">Configurar</button></div>
        </section>
        <section class="mail-panel">
            <label class="field-label" for="greetingInput">SALUDO</label>
            <input id="greetingInput" class="wide-input" type="text">
            <label class="field-label" for="subjectInput">ASUNTO</label>
            <input id="subjectInput" class="wide-input" type="text" readonly>
        </section>
        <section class="mail-panel preview-panel">
            <div id="mailPreviewGreeting"></div>
            <div id="mailVehicleTableWrap"></div>
            <div class="mail-table-wrap"><table class="mail-items-table"><thead><tr><th>No.</th><th>Descripcion</th><th>Cantidad</th><th>Estado</th><th>Pint.</th><th>Dato</th></tr></thead><tbody id="mailItemsTableBody"></tbody></table></div>
            <div class="mail-actions"><button id="openGmailBtn" class="button primary">Abrir en Gmail</button></div>
            <p id="mailStatus" aria-live="polite"></p>
        </section>
    </main>

    <div id="recipientsModal" class="modal-backdrop" hidden>
        <section class="recipients-modal">
            <div class="modal-heading">
                <div><p class="eyebrow">AJUSTES</p><h2>Destinatarios</h2></div>
                <button id="closeRecipientsBtn" class="close-button">&times;</button>
            </div>

            <div class="modal-tabs">
                <button id="tabContacts" class="primary">Contactos</button>
                <button id="tabGroups" class="secondary">Grupos</button>
            </div>

            <div id="contactsSection">
                <div id="contactsList" class="contacts-list"></div>
                <button id="addContactBtn" class="add-contact-button">+</button>
                <form id="contactForm" class="contact-form" hidden>
                    <input id="contactName" class="wide-input" placeholder="Nombre" required>
                    <input id="contactEmail" class="wide-input" type="email" placeholder="Email" required>
                    <div class="form-actions">
                        <button type="button" id="cancelContactBtn" class="button secondary">Cancelar</button>
                        <button type="submit" class="button primary">OK</button>
                    </div>
                </form>
            </div>

            <div id="groupsSection" hidden>
                <div id="groupsList" class="contacts-list"></div>
                <button id="addGroupBtn" class="add-contact-button">+</button>
                <form id="groupForm" class="contact-form" hidden>
                    <input id="groupName" class="wide-input" placeholder="Nombre del Grupo" required>
                    <p class="eyebrow" style="margin-top: 10px;">SELECCIONA CORREOS:</p>
                    <div id="groupContactsList" class="group-contacts-selector"></div>
                    <div class="form-actions">
                        <button type="button" id="cancelGroupBtn" class="button secondary">Cancelar</button>
                        <button type="submit" class="button primary">OK</button>
                    </div>
                </form>
            </div>

            <button id="saveRecipientsBtn" class="button primary modal-save-button">LISTO</button>
        </section>
    </div>

    <div id="alertModal" class="modal-backdrop" hidden>
        <section class="recipients-modal" style="text-align: center;">
            <h2>ATENCIÓN</h2>
            <p id="alertMessage" style="margin: 20px 0;"></p>
            <button id="closeAlertBtn" class="button primary" style="width: 100%;">Entendido</button>
        </section>
    </div>

    <script src="storage.js"></script>
    <script src="correo.js"></script>
</body>
</html>
