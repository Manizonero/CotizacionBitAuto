<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar cotizacion</title>
    <link rel="stylesheet" href="correo.css">
</head>
<body>
        <nav class="top-nav" aria-label="Navegacion principal">
            <a href="index.html" class="nav-ico" aria-label="Datos" title="Datos"><span aria-hidden="true">📋</span></a>
            <a href="fotos.html" class="nav-ico" aria-label="Fotos" title="Fotos"><span aria-hidden="true">📷</span></a>
            <a href="verificacion.html" class="nav-ico" aria-label="Verificacion" title="Verificacion"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#315ddc" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></a>
            <a href="correo.html" class="nav-ico" aria-label="Correo" title="Correo"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#315ddc" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg></a>
        </nav>
        <main class="mail-app">
        <header class="mail-header">
            <div><p class="eyebrow">BITAUTO / COTIZACION</p><h1>Preparar correo</h1><p id="mailVehicleLabel" class="muted"></p></div>
        </header>
        <section class="mail-panel">
            <div class="panel-title"><div><p class="eyebrow">DESTINATARIOS</p><h2>Correos predeterminados</h2><p id="selectedRecipients" class="muted">Ningun correo seleccionado</p></div><button id="openRecipientsBtn" class="button primary" type="button">Seleccionar</button></div>
        </section>
        <section class="mail-panel">
            <label class="field-label" for="greetingInput">SALUDO</label>
            <input id="greetingInput" class="wide-input" type="text" placeholder="Cordial saludo,"><label class="field-label" for="subjectInput">ASUNTO</label>
            <input id="subjectInput" class="wide-input" type="text" readonly>
        </section>
        <section class="mail-panel preview-panel">
            <div class="panel-title"><div><p class="eyebrow">VISTA PREVIA</p><h2>Cuerpo del correo</h2></div></div>
            <div id="mailPreviewGreeting" class="mail-preview-greeting"></div>
            <div class="mail-preview-section-title">Datos del vehiculo</div>
            <div id="mailVehicleTableWrap" class="mail-table-wrap"></div>
            <div class="mail-preview-section-title">Repuestos solicitados</div>
            <div class="mail-table-wrap"><table class="mail-items-table"><thead><tr><th>No.</th><th>Descripcion</th><th>Cantidad</th><th>Estado</th><th>Pint.</th><th>Dato</th></tr></thead><tbody id="mailItemsTableBody"></tbody></table></div>
            <div class="mail-actions"><button id="openGmailBtn" class="button primary" type="button">Abrir en Gmail</button></div>
            <p id="mailStatus" class="status" aria-live="polite"></p>
        </section>
    </main>
    <div id="recipientsModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="recipients-title" hidden>
        <section class="recipients-modal">
            <div class="modal-heading"><div><p class="eyebrow">DESTINATARIOS</p><h2 id="recipients-title">Selecciona los correos</h2></div><button id="closeRecipientsBtn" class="close-button" type="button" aria-label="Cerrar">&#10005;</button></div>
            <div id="contactsList" class="contacts-list"></div>
            <button id="addContactBtn" class="add-contact-button" type="button" title="Agregar destinatario" aria-label="Agregar destinatario">+</button>
            <form id="contactForm" class="contact-form" hidden>
                <input id="contactName" type="text" placeholder="Nombre del correo" required>
                <input id="contactEmail" type="email" placeholder="correo@ejemplo.com" required>
                <div class="form-actions"><button id="cancelContactBtn" type="button" class="button secondary">Cancelar</button><button type="submit" class="button primary">Guardar</button></div>
            </form>
            <p id="contactStatus" class="status" aria-live="polite"></p>
            <button id="saveRecipientsBtn" class="button primary modal-save-button" type="button">Usar seleccionados</button>
        </section>
    </div>
    <script src="correo.js"></script>
</body>
</html>
